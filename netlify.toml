# Netlify build configuration for the Xenon Ophthalmics frontend.
# The React app lives in /frontend; this repo also contains a FastAPI
# backend in /backend which Netlify does NOT deploy (it needs its own
# host - Railway, Render, Fly, etc). Point REACT_APP_BACKEND_URL (set
# in Netlify's Site settings -> Environment variables) at that host.

[build]
  base = "frontend"
  publish = "build"
  command = "yarn build:netlify"
  # Netlify's monorepo change-detection sometimes cancels deploys with
  # "no content change" even when new commits land, because its diff
  # only looks inside `base` and can miss root-level commits (e.g. this
  # file, memory/docs, backend-only pushes bundled in the same commit).
  # `exit 1` here means "do NOT ignore this build" - i.e. always build,
  # on every push, regardless of what changed. (Netlify's ignore command
  # convention is inverted: exit 0 = skip build, exit 1 = proceed.)
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React Router handle every route client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cross-origin isolation headers, mirrors the dev-server headers in
# frontend/craco.config.js. Some third-party WASM modules (e.g. the
# Tint/Banuba VTO SDK's SIMD build) rely on SharedArrayBuffer, which
# browsers only expose to a "cross-origin isolated" page - one that
# sends both COOP and COEP. Without these, that WASM module can fail
# to instantiate with no visible error, leaving its own UI stuck on a
# spinner forever. `credentialless` (rather than `require-corp`) is
# used for COEP so third-party assets that don't set their own
# Cross-Origin-Resource-Policy header aren't blocked from loading.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"
